name: Build iOS App (.ipa)

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile & Package iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test
        continue-on-error: true

      - name: Build iOS Application (Unsigned Release)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package into IPA Archive
        run: |
          cd build/ios/iphoneos
          rm -rf Payload colosseum_client.ipa
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -ry colosseum_client.ipa Payload
          ls -lh colosseum_client.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-ios-ipa
          path: build/ios/iphoneos/colosseum_client.ipa
          retention-days: 7

